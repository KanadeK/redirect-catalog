[build-system]
requires = ["setuptools==84.2.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "redirect-catalog"
version = "0.1.0"
description = "Reconcile redirect plans with old and live path catalogs before a site migration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.scripts]
redirect-catalog = "redirect_catalog.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/redirect-catalog"
Issues = "https://github.com/KanadeK/redirect-catalog/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
